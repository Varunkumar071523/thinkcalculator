# Builds the static export (see docs/DEPLOYMENT.md) and uploads it to Hostinger's public_html
# over FTPS. Runs automatically on every push to main (enabled in Sprint 35), and can also be
# triggered manually from the Actions tab via workflow_dispatch.
#
# This still requires three repository secrets before it can do anything (Settings -> Secrets and
# variables -> Actions):
#   FTP_HOST     - from hPanel -> Files -> FTP Accounts
#   FTP_USERNAME - same location
#   FTP_PASSWORD - same location (or set a new one there)
# See docs/DEPLOYMENT.md for exact steps and docs/LAUNCH-CHECKLIST.md for where this fits in the
# overall launch sequence.
#
# The guard job below fails the run closed with an explanatory message if any of those three
# secrets are missing, instead of silently attempting (and failing) an FTP connection. It passes
# through harmlessly on every run once the secrets exist.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  guard:
    name: Check FTP secrets are configured
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check required secrets
        id: check
        run: |
          if [ -z "${{ secrets.FTP_HOST }}" ] || [ -z "${{ secrets.FTP_USERNAME }}" ] || [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::FTP_HOST, FTP_USERNAME, and FTP_PASSWORD repository secrets are not all set. See the comment at the top of this workflow file for where to find them in hPanel. Deployment skipped."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    name: Build static export and deploy
    needs: guard
    if: needs.guard.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build:export

      - name: Deploy out/ to Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/          
          server-dir: /domains/thinkcalculator.in/public_html/
